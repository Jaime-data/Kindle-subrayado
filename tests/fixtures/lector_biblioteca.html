<!doctype html>
<!-- Réplica del lector web: el armazón llega vacío y la app pide los datos
     después, que es justo lo que despistó al primer sondeo. -->
<html lang="es"><head><meta charset="utf-8"><title>Kindle</title></head>
<body>
<div id="button-filters"><button aria-haspopup="listbox">Todos los elementos</button></div>
<div id="web-library-root"><span>Cargando…</span></div>
<script>
  setTimeout(async () => {
    const r = await fetch("lector_datos.json");
    const datos = await r.json();
    document.getElementById("web-library-root").innerHTML =
      '<ul id="cover-art-grid">' + datos.itemsList.map(
        i => `<li id="title-${i.asin}"><span>${i.title}</span></li>`).join("") + "</ul>";
  }, 600);
</script>
</body></html>
