<!doctype html>
<!-- Panel de anotaciones de un libro concreto en read.amazon.com/notebook. -->
<html lang="es">
<head><meta charset="utf-8"></head>
<body>
  <div id="kp-notebook-library">
    <div id="B00ABCDEFG" class="kp-notebook-library-each-book">
      <h2 class="kp-notebook-searchable">Sapiens</h2>
      <p class="kp-notebook-searchable">De: Yuval Noah Harari</p>
    </div>
  </div>

  <div id="kp-notebook-annotations">
    <div class="a-row a-spacing-base">
      <input type="hidden" id="kp-annotation-location" value="356">
      <span id="annotationHighlightHeader">Subrayado amarillo | Página: 24</span>
      <span id="highlight">Los humanos evolucionaron para pensar en individuos.</span>
      <span id="note"></span>
    </div>

    <div class="a-row a-spacing-base">
      <input type="hidden" id="kp-annotation-location" value="412">
      <span id="annotationHighlightHeader">Subrayado azul | Página: 30</span>
      <span id="highlight">El dinero es la historia más eficaz jamás contada.</span>
      <span id="note">Enlazar con el capítulo de imperios.</span>
    </div>

    <div class="a-row a-spacing-base">
      <input type="hidden" id="kp-annotation-location" value="500">
      <span id="annotationNoteHeader">Nota | Posición: 500</span>
      <span id="note">Una nota suelta sin subrayado.</span>
    </div>

    <div class="a-row a-spacing-base">
      <span id="annotationHighlightHeader">Vacío</span>
    </div>
  </div>
</body>
</html>
